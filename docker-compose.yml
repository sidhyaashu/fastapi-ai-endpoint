version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:password@postgres:5432/mydatabase
      - SYNC_DATABASE_URL=postgresql://user:password@postgres:5432/mydatabase
      - REDIS_URL=redis://redis:6379
      # Pass through other environment variables from a .env file
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEFAULT_PLATFORM=${DEFAULT_PLATFORM}
      - FALLBACK_PLATFORMS=${FALLBACK_PLATFORMS}
      - SECRET_KEY=${SECRET_KEY}

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c "shared_preload_libraries='pg_stat_statements'"

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
